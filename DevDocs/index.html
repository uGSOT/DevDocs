<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDocs Collection | Open Source</title>
    <meta name="description" content="A community-driven collection of essential developer documentations and resources.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <header class="header">
        <div class="container">
            <h1 class="logo">DevDocs<span class="highlight">Hub</span></h1>
            <p class="subtitle">A curated, open-source collection of developer resources. Start contributing today!</p>
            
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search documentation... (e.g. React, CSS)" aria-label="Search documentation">
            </div>
        </div>
    </header>

    <main class="main-content container">
        <div id="loading" class="loading">Loading resources...</div>
        
        <div class="filters" id="filters">
            <!-- Filter buttons will be injected here by JS -->
        </div>

        <div class="docs-grid" id="docsGrid">
            <!-- Cards will be injected here by JS -->
        </div>
        
        <div id="noResults" class="no-results hidden">
            <p>No documentation found matching your search.</p>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Made with ❤️ by the Open Source Community.</p>
            <p>Want to add a doc? Check out the <a href="https://github.com/your-username/your-repo/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener noreferrer">Contribution Guide</a>.</p>
        </div>
    </footer>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
